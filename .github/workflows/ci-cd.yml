name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm install

      - name: Run frontend tests
        run: npm test -- --watchAll=false --passWithNoTests

      - name: Build frontend
        run: CI=false npm run build

      - name: Install backend dependencies
        run: cd node-backend && npm install

      - name: Backend syntax check
        run: cd node-backend && node --check server.js

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/contact-company-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/contact-company-frontend:${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./node-backend/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/contact-company-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/contact-company-backend:${{ github.sha }}

      - name: Trigger Render Backend Deployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -n "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}" ]; then
            curl -f -X POST "${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}"
          else
            echo "RENDER_BACKEND_DEPLOY_HOOK secret is not configured."
          fi

      - name: Trigger Render Frontend Deployment
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -n "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}" ]; then
            curl -f -X POST "${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}"
          else
            echo "RENDER_FRONTEND_DEPLOY_HOOK secret is not configured."
          fi