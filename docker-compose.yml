services:
  mongo:
    image: mongo:7
    container_name: contact-company-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: .
      dockerfile: node-backend/Dockerfile
    container_name: contact-company-backend
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/contactdb
      NODE_ENV: production
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: contact-company-frontend
    environment:
      REACT_APP_API_BASE_URL: http://localhost:5000
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  mongo_data:
